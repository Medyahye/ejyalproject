# Render Blueprint (free plan): Django web service.
# Database: free PostgreSQL on Neon (neon.tech) -> paste its connection string
# as DATABASE_URL when Render asks for it.
# Free plan note: the server sleeps after 15 min without traffic; the next
# request wakes it up in ~1 minute.
services:
  - type: web
    name: generations-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/settings/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: SEED_DEMO
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        sync: false
