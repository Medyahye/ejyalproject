# Render Blueprint: one Django web service + one PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: generations-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /api/settings/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: SEED_DEMO
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: generations-db
          property: connectionString

databases:
  - name: generations-db
    databaseName: generations
    user: generations
    plan: basic-256mb
    region: frankfurt
